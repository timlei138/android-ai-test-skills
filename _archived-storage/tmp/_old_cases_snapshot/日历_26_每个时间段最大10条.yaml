# ── 执行须知（渲染到 MD 顶部，回放前必读）────────────────
# 为什么写在这里而不是 SKILL.md：这些是**跟着这条用例走**的操作约束，
# 不是通用规约。放 SKILL 里会被当背景噪音跳过，放这里才会在回放前被读到。
playbook:
  - title: "坑挂在步骤上，不放在文件级"
    body: |
      本文件的坑一律写在**它真正会出现的那一步**的 `pitfalls:` 下。
      回放是**按步走**的 —— 跑到第 2 步时第 1 步的坑还在眼前，**信息被稀释**，
      真正相关的那条反而看不见。**走到哪一步，就只看那一步的 `pitfalls`。**

  - title: "工具层的坑（与 App 无关，知识卡里不一定有）"
    body: |
      这类坑不属于任何页面，是**工具或操作方式本身**的问题：
      · ❌ `act input` 清空输入框会触发工具层崩溃
        （`ADB_KEYBOARD_CLEAR_TEXT` → `ExtractedText.text on a null object reference`），
        且崩溃后会话状态不明（`execution_state=may_have_executed`）
        —— 按规约**禁止重放**，会话只能以 BLOCKED 收尾。
      · ❌ 用 `swipe` 拨滚轮/滑列表：**有惯性会过冲**，来回震荡无法收敛。
        重复手势一律用 `act tap --repeat N --gap MS`。
      · ❌ 用 PowerShell 的 `for`/`foreach` 包 `run.py`：**中断即锁死会话**。
      ⚠️ 实测教训：某次**连拨滚轮 37 次**才想起查卡，而知识卡那节标题叫
      「弹框滚轮-上课时长循环」—— 从"我在拨滚轮"这个**现象根本检索不到它**。
      ⇒ 检索知识卡时，用你脑子里的**现象词**（拨不准/过冲/没反应）换几个说法多 grep 几次。

# ── 前置条件 ──────────────────────────────────────────
# 不满足就 BLOCKED。**绝不自己去凑条件**。
# ── 前置条件 ──────────────────────────────────────────
# 分三类（2026-10-15 定）——**因为"能不能动手改"是三种不同的事**：
#   goto    🧭 导航：把 App 开到某界面。起点由 session start 的冷启动钉死在首页，故必写。
#   prepare 🔧 准备：要动手改设备状态。**已有则跳过**（skip_if），做法写死在 do 里。
#   assert  🔒 断言：只能检查、改不了。不满足即 BLOCKED。
# ⚠️ 为什么必须分：原先笼统一个列表，AI 分不清该"动手做"还是"直接停"——
#    同一份 YAML 里，「存在课表」动手建了，「周视图有空白格」却不敢动而卡住。
# ⚠️ 清理类（pm clear / pm revoke）**只在用例明确要求时**才用（如「首次使用」）。
#    会话开始只 force-stop（关进程、不碰数据）。
# ⚠️ 条目**只增不删**：老条目里常含用例前提（如「未授予相机权限」「记下节数基线」），
#    那是断言依据，删掉了就没法判卷。
preconditions:
  - desc: 从日历首页进到课程表页（会话已冷启动复位，起点必为首页）
    type: goto
    target: 课程表页（.timetable.display.TimetableActivity）
    path: 日历首页 → 点右上角「更多」`iv_more` → 菜单里点「课程表」。⚠️ 菜单**四项共用 rid `item_title`**（课程表/纵览/年视图/设置），必须按 text 区分。两次调用即可到位（会话465 ev#3617 ev#3618 实测）。
    skip_if:
      activity: .timetable.display.TimetableActivity
    on_fail: BLOCKED
    verified_by: 会话465 ev#3617 ev#3618 实测两次调用到位
  - desc: ★起点：当前停在**课程表页-周视图**
    check:
      activity: .timetable.display.TimetableActivity
    how: 读 activity 确认在周视图；不是则先导航到该页。
    on_fail: BLOCKED
    note: s1 依赖起点是周视图（要经 课程表设置 → 列表页 → 编辑页 → 时间设置）。
    verified_by: 会话450 起于周视图
    type: assert
  - desc: 存在一个可进入编辑的课程表（当前课程表即可）
    check:
      current_timetable_exists: true
    how: 进周视图后应能读到 action_curriculum_table_settings 节点，且 toolbar_title 非空态文案
    on_fail: BLOCKED
    note: '本用例**不要求**空态，也不要求清数据。有课表即可。 若清过数据导致无课表，需先创建一个（属状态变更，须在 summary 中声明）。 ⚠️ 课表名**每次可能不同**（会话450 是『学生课程表』、会话472 是『测试课表182』），**不要写死名字**，按 rid=tv_schedule_name 点当前课表行。

      '
    verified_by: 会话472 实测：使用既有课表『测试课表182』，走通全链路
    type: assert
  - desc: 记下上午/下午的节数基线（用于断言「增加到 10 为止」）
    check:
      baseline_taken: true
    how: TimeSlotSettingsActivity 上读 tv_morning_slot_count / tv_afternoon_slot_count。
    on_fail: BLOCKED
    note: '⚠️ 基线**必须在进入 TimeSlotSettingsActivity 后读**，不要在别处猜。 本机基线为 上午4节 / 下午5节（随课程表不同会变）。

      '
    verified_by: 会话450 实测基线：上午4节、下午5节
    type: assert
steps:
  - id: s1
    desc: "从周视图进入「全部课程表」列表页，再进课程表的时间设置页"
    case_step: "（非用例步骤：到达「课程时间设置」页的操作起点）"
    do:
      - tap: {rid: action_curriculum_table_settings, desc: "课程表设置"}
      # ⚠️ 不要写死课表名！原写 text:"学生课程表"，但课表名随设备状态而变
      #    （会话472 实测屏上唯一课表名为『测试课表182』，按原名点会**点空**）。
      #    正确做法：点 `tv_schedule_name` 那一行（当前课表），按 rid 定位、名字只作参考。
      - tap: {rid: tv_schedule_name, desc: "当前课表行（勿写死名字，按 rid 点）"}
      - tap: {rid: layout_time_settings}
    know:
      where: >
        周视图 .timetable.display.TimetableActivity →
        全部课程表 .timetable.management.TimetableListActivity →
        编辑课程表页 .timetable.management.EditTimetableActivity →
        课程时间设置页 .timetable.management.TimeSlotSettingsActivity
      why_this: |
        **三步链路，一步都不能省**：
        ① 周视图右上 action_curriculum_table_settings（desc=课程表设置）
           进『全部课程表』列表页；
        ② 列表页点**课表名** → 进『编辑课程表』页
           （⚠️ 点课表名是**编辑**，不是查看，也不是切换当前课表）；
        ③ 编辑课程表页点 layout_time_settings（『课程时间设置』行）
           → 进 TimeSlotSettingsActivity，本用例的目标页。
      locate: "rid=action_curriculum_table_settings；课表行按 rid=tv_schedule_name 定位（**勿写死名字**）；rid=layout_time_settings"
    expect:
      activity: ".timetable.management.TimeSlotSettingsActivity"
      # ★ 位置判据：s1 与 s2 的 activity **完全相同**，光靠它认不出"走到哪了"。
      #   用**节数**区分：s1 刚进来 = 基线（会话472 实测 上午4/下午4）；
      #   s2 做完 = 已到上限（上午10/下午10）。
      node_present: {rid: tv_afternoon_slot_count}
      note: "回读节数应为**基线值**（会话472 实测 上午4节/下午4节）。已成 10/10 说明 s2 已跑过，直接从 s2 之后接续。"
    on_fail: "BLOCKED"
    pitfalls:
      - "⚠️ **从周视图按 back 是回日历首页，不是回上一级** —— 别用 back 找路。"
      - "列表页点课表名进的是**编辑课程表**页（EditTimetableActivity），不是『查看』；想切换当前课表要先点右上 action_schedule 进多选态。"
      - "⚠️ **本页的修改不会持久化**：从 TimeSlotSettingsActivity 按 back 返回后再进来，节数会回到原值（实测下午回到 5 节、上午回到 4 节）。**别把『没保存』误判成『无法修改』** —— 本用例只验上限，不要求保存。"
    evidence: "会话450 ev#3494 ev#3497 ev#3498 ev#3499"

  - id: s2
    desc: "反复点「下午」的新建按钮到上限；再点「上午」的新建按钮到上限"
    case_step: "1~2. 查看每个时间段最大可选多少节课 / 点击添加节数直到最大"
    do:
      # ⚠️ 下面的 repeat 是**一次调用内连点 N 下**，不是写错、也不是可省略的两次。
      #    拆成 N 次独立调用会因每次冷启动 3-6 秒而极易撞超时，
      #    且超时=动作已执行却没记账 → 会话作废。
      - tap: {rid: btn_add_afternoon_slot, desc: "新建", repeat: 8, gap_ms: 700}
      - tap: {rid: btn_add_morning_slot, desc: "新建", repeat: 8, gap_ms: 700}
    know:
      where: "课程时间设置页 (.timetable.management.TimeSlotSettingsActivity)"
      why_this: |
        两个「新建」按钮 rid 不同、desc 都是『新建』，**必须按 rid 区分**：
          btn_add_afternoon_slot（下午，本机 c=[2842,1611]）
          btn_add_morning_slot （上午，本机 c=[2842,747]）
        对应的删除按钮是 btn_remove_*。
        每点一次 +1 节，到上限后**再点无任何反应**（按钮仍 enabled/clickable，
        且**不弹 toast**）—— 所以只能用计数判定，不能靠「有没有报错」。
      locate: "rid=btn_add_afternoon_slot / rid=btn_add_morning_slot"
    expect:
      activity: ".timetable.management.TimeSlotSettingsActivity"
      # ★ 位置判据：做完 s2 应**已到上限**（会话472 实测上午10/下午10）。
      #   这是"本步已跑完"的标志，与 s1 的基线值形成对照。
      slot_count_at_cap: {morning: 10, afternoon: 10}
      note: "两处节数都应读成 **10节**（会话472 实测）。若仍是基线值（4/4），说明 s2 尚未跑。"
    on_fail: "BLOCKED"
    pitfalls:
      - "⚠️ **到上限后按钮不会置灰、也不会弹提示**，只是静默不生效。因此『点了几次』不能作判据，**必须回读节数**。"
      - "⚠️ 用 `--repeat N` 一次点完，**不要**拆成 N 次 `run.py` 调用；也不要用 PowerShell 循环包 `run.py`（中断即锁会话，历史上真锁过）。"
      - "两个「新建」按钮 **desc 都是『新建』** —— 必须按 rid 区分上午/下午（btn_add_morning_slot / btn_add_afternoon_slot），按 desc 找会点错。"
      - "⚠️⚠️ **『每个时间段最大10条』= 上午/下午各自 10，不是合计 10**。按合计理解会把 PASS 误判成 WARN（**本用例历史上真错过一次**，见 a1 的 note）。"
      - "⚠️ 本页的『完成』按钮**点了没反应**（实测连点 2 次，activity 均不变，未回到 EditTimetableActivity）—— 属实测现象，**不是点空了**，别据此判缺陷。"
      - text: >-
          ⚠️⚠️ **`do` 里两条的顺序不能反**（先下午、后上午）—— 上午加到 10 节后
          `ll_morning_slots` 会撑满 `[88,835]`–`[2952,1871]`，**下午整块被挤出屏幕**，
          `tv_afternoon_slot_count` 和 `btn_add_afternoon_slot` 在 dump 里**根本不存在**。
          顺序反了就会「点不到下午按钮」而误判为缺陷。
          ⚠️ 因此**读下午节数前必须先滚动**：本次用
          `act swipe --from 1520,1500 --to 1520,500 --dur 800`（dur 加长以减惯性），
          滚后即读到 `tv_afternoon_slot_count=10节`。
          ⚠️ 注意 `read` 是截图 OCR，**读不到屏外内容**，别指望它。
        evidence: "会话472 ev#3715 ev#3716 ev#3718 实测"
      - text: >-
          ⚠️ **收尾退出时 `act back` 会被连续吞掉** —— 会话472 实测 back 连按 3 次，
          activity 始终停在 `EditTimetableActivity`。改点
          **「转到上一层级」`[123,203]`** 一次即退出到列表页，再点一次回周视图。
          ⇒ **编辑页/列表页要用左上角返回箭头，不要用 back 键。**
          ⚠️ 本用例**不要点 `save_view`「完成」** —— 节数改动（4/4→10/10）不该被持久化，
          用例只验上限、未要求保存。
        evidence: "会话472 ev#3719 ev#3720 ev#3722 ev#3723 实测"
    evidence: "会话450 ev#3500~ev#3504 ev#3507 ev#3508；会话472 ev#3709~ev#3723"

# ── 断言（对应用例的预期）─────────────────────────────
assertions:
  # ⚠️⚠️ case_expect 必须是**用例原文**。本例原文只有 **1 条**预期
  #   （「2.最多只能添加十个时段」，注意它自己的编号就是 2，缺 1）。
  #   但原文这一条同时含**两个可分别判定的点**：①上限是多少 ②到上限后不能再加。
  #   ⇒ 拆成 a1/a2 两条记录（**判据更细，不是改写**）：
  #      a1.case_expect = 原文全文（上限语义）
  #      a2.case_expect = 原文全文（"不能再添加"的落点），用 suffix 标明是同一条预期的细分
  - id: a1
    case_expect: "2.最多只能添加十个时段"
    desc: "上限 = **每个时间段各自 10 节**（原文唯一一条预期的前半语义）"
    check:
      slot_count_cap: {morning: 10, afternoon: 10, mode: "per_group"}
      # 判据：回读 tv_morning_slot_count / tv_afternoon_slot_count
      measured:
        afternoon: "4 -> 10（连点 6 次到顶）"
        morning: "4 -> 10（连点 8 次到顶，其中 2 次被吞）"
    status_last_run: "PASS"
    evidence: "会话450 finding#333；会话472 finding#391 ev#3709~ev#3723 复跑复核"
    note: >
      ⚠️ **本条曾误判为 WARN**：当时把『最大10条』理解成了「上午+下午合计 10 条」，
      而实测总数为 20（上午10 + 下午10），据此判为不符。
      经确认，用例语义是**每个时间段各自最大 10 条**，实测完全符合，**已改正为 PASS**。
      回放时务必按 per_group 判定。
      ⚠️ 复跑基线修正：会话472 实测**下午也是 4 节**（旧记「下午5节」有误）。

  - id: a2
    case_expect: "2.最多只能添加十个时段"
    desc: "同一条预期的后半语义：**到上限后不能再添加**"
    check:
      at_cap_no_effect:
        - "下午到 10 节后再点 btn_add_afternoon_slot 2 次，tv_afternoon_slot_count 仍为 10节"
        - "按钮属性仍为 enabled=true / clickable=true（不置灰）"
        - "无 toast 提示"
    status_last_run: "PASS"
    evidence: "会话450 finding#333；会话472 finding#391"

# ── 坑 ────────────────────────────────────────────────
# ⚠️ **坑一律挂在具体步骤上**（每步的 `pitfalls:`），本文件**不再设文件级 pitfalls**。
