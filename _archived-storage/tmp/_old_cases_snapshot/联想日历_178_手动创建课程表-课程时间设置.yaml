    desc: "页面含各设置项；**但『晚上』一项不存在**"
    check:
      nodes_present:
        - {rid: layout_lesson_duration, text: "50分钟"}
        - {rid: layout_break_duration, text: "10分钟"}
        - {rid: layout_morning_header}
        - {rid: tv_morning_slot_count, text: "4节"}
