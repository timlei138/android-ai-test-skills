# ── 执行须知（渲染到 MD 顶部，回放前必读）────────────────
# 为什么写在这里而不是 SKILL.md：这些是**跟着这条用例走**的操作约束，
# 不是通用规约。放 SKILL 里会被当背景噪音跳过，放这里才会在回放前被读到。
playbook:
  - title: "坑挂在步骤上，不放在文件级"
    body: |
      本文件的坑一律写在**它真正会出现的那一步**的 `pitfalls:` 下。
      回放是**按步走**的 —— 跑到第 2 步时第 1 步的坑还在眼前，**信息被稀释**，
      真正相关的那条反而看不见。**走到哪一步，就只看那一步的 `pitfalls`。**

  - title: "工具层的坑（与 App 无关，知识卡里不一定有）"
    body: |
      这类坑不属于任何页面，是**工具或操作方式本身**的问题：
      · ❌ `act input` 清空输入框会触发工具层崩溃
        （`ADB_KEYBOARD_CLEAR_TEXT` → `ExtractedText.text on a null object reference`），
        且崩溃后会话状态不明（`execution_state=may_have_executed`）
        —— 按规约**禁止重放**，会话只能以 BLOCKED 收尾。
      · ❌ 用 `swipe` 拨滚轮/滑列表：**有惯性会过冲**，来回震荡无法收敛。
        重复手势一律用 `act tap --repeat N --gap MS`。
      · ❌ 用 PowerShell 的 `for`/`foreach` 包 `run.py`：**中断即锁死会话**。
      ⚠️ 实测教训：某次**连拨滚轮 37 次**才想起查卡，而知识卡那节标题叫
      「弹框滚轮-上课时长循环」—— 从"我在拨滚轮"这个**现象根本检索不到它**。
      ⇒ 检索知识卡时，用你脑子里的**现象词**（拨不准/过冲/没反应）换几个说法多 grep 几次。

# ── 前置条件 ──────────────────────────────────────────
# 不满足就 BLOCKED。**绝不自己去凑条件**。
# ── 前置条件 ──────────────────────────────────────────
# 分三类（2026-10-15 定）——**因为"能不能动手改"是三种不同的事**：
#   goto    🧭 导航：把 App 开到某界面。起点由 session start 的冷启动钉死在首页，故必写。
#   prepare 🔧 准备：要动手改设备状态。**已有则跳过**（skip_if），做法写死在 do 里。
#   assert  🔒 断言：只能检查、改不了。不满足即 BLOCKED。
# ⚠️ 为什么必须分：原先笼统一个列表，AI 分不清该"动手做"还是"直接停"——
#    同一份 YAML 里，「存在课表」动手建了，「周视图有空白格」却不敢动而卡住。
# ⚠️ 清理类（pm clear / pm revoke）**只在用例明确要求时**才用（如「首次使用」）。
#    会话开始只 force-stop（关进程、不碰数据）。
# ⚠️ 条目**只增不删**：老条目里常含用例前提（如「未授予相机权限」「记下节数基线」），
#    那是断言依据，删掉了就没法判卷。
preconditions:
  - desc: 从日历首页进到课程表基本信息编辑页（会话已冷启动复位，起点必为首页）
    type: goto
    target: 课程表基本信息编辑页（.timetable.management.EditTimetableActivity）
    path: >
      日历首页 → 点右上角「更多」`iv_more` → 菜单里点「课程表」（→ TimetableActivity 课程表页）
      → 点 `btnCreateManually`「手动创建课程表」→ EditTimetableActivity。
      ⚠️ 菜单**四项共用 rid `item_title`**（课程表/纵览/年视图/设置），必须按 text 区分。
      ⚠️ **共 3 次调用**（会话470 实测 ev#3681 ev#3682 ev#3683）——
      本用例起点是**编辑页**而不是课程表页，别只走到课程表页就停（这是本用例最容易走错的一步）。
    skip_if:
      activity: .timetable.management.EditTimetableActivity
    on_fail: BLOCKED
    verified_by: 会话470 ev#3681 ev#3682 ev#3683 实测三次调用到编辑页
  - desc: ★起点：当前停在**课程表基本信息编辑页**（『新建课程表』或『编辑课程表』）
    check:
      activity: .timetable.management.EditTimetableActivity
    how: 读 activity 确认；不是则先经空态 btnCreateManually 或有课表时经列表页进入。
    on_fail: BLOCKED
    note: s1 依赖起点是编辑页（要点其上的 layout_time_settings 行）。
    verified_by: 会话453 起于会话452 遗留的『新建课程表』编辑页
    type: assert
  - desc: 从「手动创建课程表」路径进入课程表基本信息编辑页（用例前提原文）
    check:
      activity: .timetable.management.EditTimetableActivity
      title: 新建课程表
    how: '课程表空态点 btnCreateManually（手动创建课程表）。 本用例前提写的是「**手动创建**课程表」，不是图库/拍照导入 —— **两条路径的时间设置页默认值不同**（见 s1 的 why_this），不可混用。

      '
    on_fail: BLOCKED
    note: '⚠️ 若已有课表，也可从「周视图 → action_curriculum_table_settings → 课表名 → 编辑课程表页」进入，但那是**已保存课表**， 其时序/默认值可能与「新建」不同，回放时需注意。

      '
    verified_by: 会话453 实测：由会话452 的未保存新建课表页直接进入
    type: assert
steps:
  - id: s1
    desc: "在基本信息编辑页点「课程时间设置」，进入课程时间设置页"
    case_step: "1. 进入课程时间设置页"
    do:
      - tap: {rid: layout_time_settings}
    know:
      where: >
        课程表基本信息编辑页 (.timetable.management.EditTimetableActivity)
        → 课程时间设置页 (.timetable.management.TimeSlotSettingsActivity)
      why_this: |
        点 layout_time_settings（『课程时间设置』行，本机 c=[1520,1694]）
        直接进入 TimeSlotSettingsActivity。
        ⚠️ **本页默认值随课表来源而变**（实测对比）：
          手动创建：上课时长 **50分钟**、上午4节、下午4节、上午第1节 **08:00-08:50**
          图库导入：上课时长 **30分钟**、上午4节、下午5节、上午第1节 **08:00-08:30**
        因此**不能拿导入课表的数值来核对本用例**（本用例是手动创建路径）。
      locate: "rid=layout_time_settings"
    expect:
      activity: ".timetable.management.TimeSlotSettingsActivity"
      # ★ 位置判据：s1/s2 的 activity **完全相同**，光看它认不出"走到哪了"。
      #   用**设置项节点是否已读到**区分：
      #   s1 做完 = 刚进这页（本步不读值）；s2 做完 = 5 类设置项均可读到。
      node_present: {rid: layout_lesson_duration}
      note: "刚进页：确认 `layout_lesson_duration`（『每节课上课时长』行）在屏上即算到位。若已读到 tv_lesson_duration=50分钟 等具体值，说明 s2 已跑过，直接从 s2 之后接续。"
    on_fail: "BLOCKED"
    pitfalls:
      - "⚠️ **本页默认值随课表来源不同**：手动创建 50分钟/上午第1节08:00-08:50；图库导入 30分钟/上午第1节08:00-08:30。就本页而言**别把本页数值与『导入课程表信息编辑页』的数值混为一谈**，两者默认上课时长不同（本用例是手动创建路径）——核对数值前先确认课表来源。"
    evidence: "会话453 ev#3542 ev#3543"

  - id: s2
    desc: "查看页面上全部设置项（上课时长 / 课间休息 / 上午节数 / 下午节数 / 各行时间）"
    case_step: "1. 设置项包括：每节课上课时长、课间休息时长、上午、下午、晚上课程节数和每节课时间设置"
    do:
      - observe: {full: true, no_filter: true}
    know:
      where: "课程时间设置页 (.timetable.management.TimeSlotSettingsActivity)"
      why_this: |
        本页可直接从 UI 树读全（**不需要逐个点开**），实测节点：
          layout_lesson_duration  → tv_lesson_duration      （本机 50分钟）
          layout_break_duration   → tv_break_duration       （本机 10分钟）
          layout_morning_header   → tv_morning_slot_count   （本机 4节）
          layout_afternoon_header → tv_afternoon_slot_count （本机 4节）
          每个节行：tv_slot_number（第N节）+ tv_time_range（08:00-08:50）+ iv_arrow（desc=编辑）
        **先用一次 --full observe 读全，不要一节一节点开去看**。
      locate: "见上列 rid"
    expect:
      activity: ".timetable.management.TimeSlotSettingsActivity"
      # ★ 位置判据：与 s1 同为 TimeSlotSettingsActivity，靠"值已读到"区分。
      #   s2 做完 = 5 类设置项的**值节点**均可读到（不只是标题行）。
      nodes_present:
        - {rid: tv_lesson_duration}
        - {rid: tv_break_duration}
        - {rid: tv_morning_slot_count}
        - {rid: tv_afternoon_slot_count}
      note: "读完应能同时看到课的时长/课间/上午节数/下午节数**四个值节点**。若只有 `layout_*` 标题行、读不到 `tv_*` 值，说明 s2 尚未跑。"
    on_fail: "BLOCKED"
    pitfalls:
      - "⚠️ **『晚上课程』分组不存在**：对本页完整 dump 检索 晚上/evening/night 均 **0 处命中**，页面只有 上午课程、下午课程 两组。用例预期1/4/5 里所有『晚上』相关项（含『晚上课程节数』『晚上第一小节』）在此**无法验证**（与用例175 的观察一致）。"
      - "⚠️ 本页是**只读观察**：本步只用一次 `--full observe` 读全（layout_lesson_duration→tv_lesson_duration、layout_break_duration→tv_break_duration、layout_morning_header→tv_morning_slot_count、layout_afternoon_header→tv_afternoon_slot_count、每节行 tv_slot_number/tv_time_range/iv_arrow），**不要一节一节点开去看**。"
    evidence: "会话453 ev#3543"

  - id: s3
    desc: "点「每节课上课时长」打开弹框，读取默认值与档位"
    case_step: "2. 点击后弹框可选择每节课上课时长（分钟）"
    do:
      - tap: {rid: layout_lesson_duration}
      - read: {name: "读取弹框内选中行动作"}
      - tap: {rid: button2, text: "取消"}
    know:
      where: "课程时间设置页上的模态弹框"
      why_this: |
        点 layout_lesson_duration → 弹框 alertTitle=『每节课上课时长（分钟）』，
        button2=取消 / button1=确定（⚠️ 用例写的是「完成/取消」，**实机是「取消/确定」**）。
        滚轮为 **Canvas 自绘，dump 读不到当前值**，只能用 `read.py` OCR。
      locate: "rid=layout_lesson_duration；弹框 button1/button2"
    expect:
      dialog_present: {alertTitle: "每节课上课时长（分钟）"}
    on_fail: "BLOCKED"
    pitfalls:
      - "⚠️ 该弹框默认值为 **50分钟**（手动创建课表），OCR 邻档为 45 / 55，**步长 5**。"
      - "⚠️⚠️ **该弹框滚轮不要用 swipe 拨，要点格**：Canvas 自绘滚轮 dump 读不到值，且 swipe 有惯性会过冲（实测一次滑动跳过好几档，来回震荡无法收敛）。正确做法是**点选中行的上一格/下一格 = ∓1 档**，用 `act tap --x .. --y .. --repeat N` 一次点到位。"
      - "❌ **更不要用 PowerShell 循环包 `run.py`** —— 会话453 就是那样做的，中途被中断后会话直接锁死（incomplete recording），4 条预期只能记 BLOCKED。"
      - "⚠️ **别用 OCR 反馈驱动循环**：知识卡记载过「目标值5但OCR返回None → 脚本以为没动继续点 → 绕圈14分钟」的事故。正确做法是**按档位次数点按（不读 OCR 反馈）**，点确定，再**读 UI 树文本**（tv_lesson_duration / tv_break_duration）作判据。"
      - "⚠️ 弹框按钮文案实机为『取消/确定』（本机 button2=取消 c=[1244,1359]、button1=确定 c=[1795,1359]；用例写「完成/取消」）—— **按 rid 定位，别按文案找『完成』**。"
      - "⚠️ 滚轮为 Canvas 自绘、**dump 读不到当前值**，读值只能用 `read.py` OCR。"
      - text: >-
          ⚠️ **收尾时 `act back` 第一次会被吞** —— 从课程时间设置页 back 一次只回到
          `EditTimetableActivity`，**再 back 一次才退回课程表页**（会话470 实测 ev#3688→3689→3690）。
          原因：编辑页的课程表名是必填项、未填，App 拦了首次返回。
          ⇒ 别把「back 一次没退出去」当成卡死或需要强杀；**再 back 一次**即可。
          ⚠️ 本用例**不要点 `save_view`「完成」** —— 那会真建出一个课表、改变设备状态
          （用例只做设置项验证，未要求保存）。
        evidence: "会话470 ev#3688 ev#3689 ev#3690 实测 back 两次才退出；退出后课程表页仍为空态，确认未保存"
    evidence: "会话453 ev#3544 ev#3545；会话470 ev#3684~ev#3690"

# ── 断言（对应用例的预期）─────────────────────────────
