# 用例程序化描述（Programmatic Case Spec）
#
# 用途：把「已验证成功的路径」沉淀成**可直接回放**的结构化文件。
#       执行时不再由 AI 临场判断，只按本文件走。
#
# 与用例库的关系：一个 case 对应一个 yaml，文件名 = 用例标题。
#   用例原文（步骤/预期）→ storage/sessions.db 的 cases.input
#   本文件              → 用例的**可执行形态**
#
# ⚠️ 三条硬规矩（写本文件时务必遵守）：
#   1. **定位一律用 rid/文案，坐标只作兜底**——换设备/换分辨率后坐标必失效。
#   2. **on_fail 必须显式**——失败就是失败，**不允许**「换个入口再试试」。
#   3. **判据必须是机器可判的**（rid/activity/文案），不接受「显示正常」这类主观描述。
#
# ⚠️ 第 4 条硬规矩（**活的 next vs 死的 YAML**，会话454 回放实测后加）：
#   `next` 是**活的**：它只报告"当前这一屏实际能点什么"；YAML 是**死的**：
#   它写死了"应该点哪个 rid"。两者对不上时**不会报错**，只会静默跑偏。
#   三种失败形态（实测）：
#     ① 目标 rid 当前屏不存在 -> 点击落在空处，activity 不变，**无任何报错**
#        （会话454：设备停在时间设置页时点 iv_more，sig 里 iv_more=False，点空）
#     ② 目标 rid 存在但位置不同 -> 若信任 YAML 里的坐标会**点到旁边的东西**，
#        可能执行错误动作并改坏状态  ← 最危险
#     ③ 目标 rid 存在但语义变了 -> 同一个 button1 在不同弹框里可能是"删除"/"确定"
#   ⇒ **回放规则（必须遵守）**：
#     a. 每个 step 执行前，先从**当前屏**的 next/nodes 里**按 rid（或 text/desc）查**该目标；
#     b. 找到 -> 用**本次查到的位置**执行，**不要**抄本文件里的坐标；
#     c. **找不到 -> 立即停，按该 step 的 on_fail 处理**（通常是 BLOCKED），
#        **绝不**改用坐标硬点、也绝不"换个入口再试试"；
#     d. 坐标**只在元素无 rid 且无 text/desc（自绘控件）时**才用，且必须以
#        `know.coords_rule` 的**规则**现算，不是抄死值。
#   一句话：**rid 是判据，坐标是注释。**
#
# ⚠️ 已废除 `coords_hint`（2026-10-15）：它写的是"当时的实测值"，既会变、又容易被当成权威直接抄。
#    真实事故：会话465 抄了本文件 llCourseTime 的坐标点，实际点到 llCourseWeeks，开错弹框白扔 2 次调用。
#    ⇒ 有 rid/text 的一律按组合定位；只有自绘控件保留 `coords_rule`（规则，非死值）。
#
# ⚠️ 编码：本文件必须为 UTF-8（无 BOM）。经 GBK 管道写入会产生大量 '?'
#    且 YAML **仍能解析**——即「合法但内容已毁」。保存后务必肉眼确认中文正常。
#
# ⚠️ 引号约定：**字符串定界符一律用半角双引号**（YAML 语法）；
#    正文中需要强调/引用时用中文引号「」『』。**切勿混用** ——
#    中文引号在 YAML 里不是定界符，会把引号本身变成值的一部分。
#
# ⚠️ 本用例会话（#448）以 **BLOCKED** 结束，末段有一次工具层崩溃（见 pitfalls）。
#    本文件沉淀的是**已跑通的部分**，最后两个预期未取到证据，已显式标注。

