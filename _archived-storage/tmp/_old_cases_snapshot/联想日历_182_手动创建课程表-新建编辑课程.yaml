# ── 执行须知（渲染到 MD 顶部，回放前必读）────────────────
# 为什么写在这里而不是 SKILL.md：这些是**跟着这条用例走**的操作约束，
# 不是通用规约。放 SKILL 里会被当背景噪音跳过，放这里才会在回放前被读到。
playbook:
  - title: "坑挂在步骤上，不放在文件级"
    body: |
      本文件的坑一律写在**它真正会出现的那一步**的 `pitfalls:` 下。
      回放是**按步走**的 —— 跑到第 2 步时第 1 步的坑还在眼前，**信息被稀释**，
      真正相关的那条反而看不见。**走到哪一步，就只看那一步的 `pitfalls`。**

  - title: "工具层的坑（与 App 无关，知识卡里不一定有）"
    body: |
      这类坑不属于任何页面，是**工具或操作方式本身**的问题：
      · ❌ `act input` 清空输入框会触发工具层崩溃
        （`ADB_KEYBOARD_CLEAR_TEXT` → `ExtractedText.text on a null object reference`），
        且崩溃后会话状态不明（`execution_state=may_have_executed`）
        —— 按规约**禁止重放**，会话只能以 BLOCKED 收尾。
      · ❌ 用 `swipe` 拨滚轮/滑列表：**有惯性会过冲**，来回震荡无法收敛。
        重复手势一律用 `act tap --repeat N --gap MS`。
      · ❌ 用 PowerShell 的 `for`/`foreach` 包 `run.py`：**中断即锁死会话**。
      ⚠️ 实测教训：某次**连拨滚轮 37 次**才想起查卡，而知识卡那节标题叫
      「弹框滚轮-上课时长循环」—— 从"我在拨滚轮"这个**现象根本检索不到它**。
      ⇒ 检索知识卡时，用你脑子里的**现象词**（拨不准/过冲/没反应）换几个说法多 grep 几次。

# ── 前置条件 ──────────────────────────────────────────
# 分三类（2026-10-15 定）——**因为"能不能动手改"是三种不同的事**：
#   goto    🧭 导航：把 App 开到某界面。起点由 session start 的冷启动钉死在首页，故必写。
#   prepare 🔧 准备：要动手改设备状态。**已有则跳过**（skip_if）。做法写死在 do 里。
#   assert  🔒 断言：只能检查、改不了（如联网）。不满足即 BLOCKED。
# ⚠️ 为什么必须分：原先笼统一个列表，AI 分不清该"动手做"还是"直接停"——
#    同一份 YAML 里，「存在课表」动手建了，「周视图有空白格」却不敢动而卡住。
# ⚠️ 清理类（pm clear / pm revoke）**只在用例明确要求时**才用（如「首次使用」）；
#    本用例前提是「创建空课程表」——是**建**，不是**清**。会话开始只 force-stop，不清数据。
preconditions:
  # 🧭 起点：会话开始时已冷启动复位，App 必在首页。故从首页写到起点。
  - desc: "从日历首页进到课程表页-周视图"
    type: goto
    target: "课程表页-周视图（.timetable.display.TimetableActivity）"
    path: >
      日历首页（冷启动后必在此）→ 点右上角「更多」`iv_more`（c=[2835,203]）
      → 弹出菜单后点「课程表」(`item_title` + text=课程表，c=[2697,371])。
      ⚠️ 菜单四项**共用 rid `item_title`**，必须按 text 区分。
      两次调用即可到位（会话463 ev#3577 ev#3578 实测）。
    skip_if: {activity: ".timetable.display.TimetableActivity"}
    on_fail: "BLOCKED"
    note: >
      ⚠️ 会话448 开跑时曾在课程表各页间反复 back 找路（6 次调用才落位），
      **别再重演那段迷路** —— 按上面的 path 走。
    verified_by: "会话463 ev#3577 ev#3578 实测两次调用到位"

  # 🔧 准备：用例原文前提是「创建**空**课程表」。
  #    会话463 复跑时原 YAML 漏了这条 → 卡在『还未添加课程表』空态页无路可走。
  - desc: "存在一个课程表（用例原文前提「创建**空**课程表」）"
    type: prepare
    skip_if: {not_on_page: "还未添加课程表"}
    do: >
      ① 点 `btnCreateManually`（c=[1520,1717]）进 `EditTimetableActivity`；
      ② 点 `et_schedule_name`（c=[1520,375]）聚焦，再用
         `act input --x 1520 --y 375 --text="<名称>"` **一次调用内**写入
         （⚠️ **不要**拆成「先清空、再写入」两步 —— 见 s2 坑：`ADB_KEYBOARD_CLEAR_TEXT` 会崩）；
      ③ 点 `save_view`（c=[2913,202]）保存 → 自动回到周视图；
      ④ **不要动「周末有课」开关**，保持默认关闭（用例前提要求「关闭周末有课开关」）。
    on_fail: "BLOCKED"
    verified_by: "会话463 ev#3580~#3583 实测走通：建『测试课表182』后回周视图，cv_empty_content 出现"

  # 🔧 准备：周视图要有可点的空白格。这是 s1 能执行的前提。
  - desc: "周视图上至少有一个**空白小节**可点"
    type: prepare
    skip_if: {has_node: "cv_empty_content"}
    do: >
      本身就依赖课表是空的。若课表已排满，需先腾出空位 ——
      但**删课程属状态变更**，动手前须声明理由。
      （正常情况下按上一条 prepare 新建的空课表必然是空的，无需额外动作。）
    on_fail: "BLOCKED"
    note: >
      ⚠️ **不要记死「只有一个空位」**（会话448 的记载已被推翻）：
      会话463 复跑时同一页有 **5 个**空白格，
      c=[552,648] / [1104,648] / [1656,648] / [2208,648] / [2760,648]（周一~周五各一）。
      空位数随课表内容变化，**按当前屏实数判断**（从 `next` 里读无文字的格子）。
    verified_by: "会话448（1个）与 会话463（5个）两次实测数值不同 ⇒ 不可写死"

# ── 步骤 ──────────────────────────────────────────────
steps:
  - id: s1
    desc: "点周视图的空白小节，进入新建课程页"
    case_step: "1. 在课程表界面点击空白小节"
    do:
      # ⚠️ repeat=2 是**一次调用内连点两下**，必须保留：
      #    本机实测第一次点按被网格吸收、第二次才进入新建课程页。
      #    拆成两次独立调用会因落点变化而跑偏。
      - tap: {rid: cv_empty_content, repeat: 2, gap_ms: 400}
    know:
      where: "课程表页-周视图 (.timetable.display.TimetableActivity) → 新建课程页 (.timetable.course.EditCourseActivity)"
      why_this: |
        ⚠️ **第一次点按会被吸收，第二次才生效** —— 这是本机的真实行为，
        所以必须用 `--repeat 2`。直接点一次会「看起来没反应」。
        进入后页面 title=『新建课程』（编辑已有课程时是『编辑课程』）。
      locate: "rid=cv_empty_content"
    expect:
      activity: ".timetable.course.EditCourseActivity"
      # ⚠️ 会话464 修正：原判据写的是 `node_text: {rid: toolbar_title, equals: 新建课程}`，
      #    但**编辑课程页根本没有 `toolbar_title` 这个节点**（实测该页节点全集里没有它），
      #    导致该判据**恒为 false** —— 首轮执行时只要 activity 对就继续了，没人发现它失效。
      #    「新建课程」实际是个**无 rid 的普通 TextView**（b=[783,305][1047,437]）→ 按 text 判。
      text_present: "新建课程"
      note: >
        回读确认：activity 进 EditCourseActivity，且屏上出现「新建课程」字样
        （无 rid，只能按 text 匹配）。**这是区分 s1 与 183 s1「编辑课程」的关键** ——
        两者 activity 相同，只有这个标题文本不同。
    on_fail: "BLOCKED"
    pitfalls:
      - "⚠️⚠️ **周视图空白格要点两下**（`--repeat 2`）。第一次点按被网格吸收，第二次才进新建课程页 —— 点一次会『看起来没反应』。这是实测结论，不是笔误。"
      - "编辑页**没有『取消』，只有『关闭』**（本机 c=[739,314]）—— 别去找取消。"
    evidence: "会话448 ev#3433"

  - id: s2
    desc: "设置课程时间：点「课程时间」打开双滚轮弹框，取消关闭"
    case_step: "2. 设置课程信息（课程时间）"
    do:
      - tap: {rid: llCourseTime}
      - tap: {rid: button2, text: "取消"}
    know:
      where: "新建课程页 (.timetable.course.EditCourseActivity)"
      why_this: |
        点 llCourseTime（『课程时间』行，本机 c=[1520,965]）弹出双滚轮弹框，
        npTitle=『1到1节』，两个滚轮的上界为 **12**，
        含 button2=取消 / button1=确定（本机 c=[1244,1367] / [1795,1367]）。
      locate: "rid=llCourseTime → tvCourseTime 显示当前值"
    expect:
      dialog_present: {rid: button2, text: "取消"}
    on_fail: "BLOCKED"
    pitfalls:
      - "⚠️ 滚轮为 Canvas 自绘，dump 读不到值，读值要用 `read.py` OCR（见知识卡「弹框滚轮」一节）。"
      - "⚠️⚠️ **『课程时间』弹框的几何知识卡里没有（会话463 实测）**：本弹框**没有** `datePicker`/`parent`/`selector_top_divider` 这三个 rid，知识卡《滚轮要点准，先量可点带》记的是**新建事件页日期弹框**的几何，**不能照搬**。本弹框只有：`custom` b=[970,530][2070,1285]（滚轮区）、`npTitle` b=[1039,618][2001,746]（唯一读数位，显示『1到1节』）、`divider` b=[970,1285][2070,1287]。dump 中**无任何 NumberPicker 节点**。"
      - "⚠️ **读数只能靠 `npTitle`**（`read --region 1039,618,2001,746` 或直接解析 dump 的 npTitle.text）。会话463 试 x=1250 配 y=1000 / y=850 两次点击，npTitle 均仍为『1到1节』，**未找到有效可点带** —— 下次复跑若要验『1~12 节』范围，需**先花少量调用量出可点带**（候选 y 收敛到 3~5 个，每点一下用一次 `read` 回读，**别用 `swipe`**）。"
      - "『课程时间』弹框两个滚轮**上界都是 12**（会话448 记载，会话463 未能复核 —— 未取到证据）。"
      - "❌ **不要用 `act input` 清空输入框**：会话448 末尾用 `act.py input` 时触发了工具层崩溃 ——
        `broadcast ADB_KEYBOARD_CLEAR_TEXT failed: ... ExtractedText.text on a null object reference`，
        导致当前调用状态不明（audit: execution_state=may_have_executed）。
        按 skill 规约「可能已执行 → 禁止重放」，会话只能以 BLOCKED 收尾。
        清空输入请用 `input --text=`（一次调用内清空并写入），**不要**先清后写分两步。
        ✅ 会话463 对照验证：建课表时用 `act input --text=` 写 `et_schedule_name`，
        **一次调用成功、无崩溃**（`mode: overwrite`）—— 反证上面那条坑的边界是「分两步」，不是「用 input」。"
    evidence: "会话448 ev#3434 ev#3435 ev#3436；会话463 ev#3582 ev#3588 ev#3602 ev#3603"

  - id: s3
    desc: "设置上课周数：打开上课周数弹框，用快捷项「全选」选满；再验『一个周都不选点完成应被拦截』"
    case_step: "3. 设置课程信息（上课周数）"
    do:
      - tap: {rid: llCourseWeeks}
      - tap: {text: "全选"}
      - tap: {rid: button1, text: "完成"}
      # ★ 负向边界（会话473 补）：取消全选后点完成，应被 toast 拦截
      - tap: {rid: llCourseWeeks}
      - tap: {text: "全选"}          # toggle：再点一次即取消全部
      - tap: {rid: button1, text: "完成"}
      - assert_toast: "请选择上课周数"
    know:
      where: "新建课程页 → 上课周数弹框"
      why_this: |
        点 llCourseWeeks（本机 c=[1520,1149]）弹出上课周数弹框：
        dialog_title=『上课周数』
        quick_select_chip_group = 全选 / 单周 / 双周
        weeks_chip_group = 第1~20周（**周数随『学期总周数』联动**）
        按钮 button2=取消 / button1=完成。
      locate: "rid=llCourseWeeks；快捷项按 text 定位；rid=button1"
    expect:
      activity: ".timetable.course.EditCourseActivity"
      # ★ 位置判据：s1/s3/s4 都停在**同一个** EditCourseActivity，
      #   光看 activity 认不出"走到哪一步"。用**本步改变了什么**区分：
      #   s3 做完 = 周数已选（weeks_chip_group 里有 selected=true 的 chip）
      week_chips_selected: true
      note: "回读 weeks_chip_group，**应至少有一个 chip 的 selected=true**。若全为 false，说明 s3 尚未跑。"
    on_fail: "BLOCKED"
    pitfalls:
      - "⚠️⚠️ **周数 chip 用的是 `selected`，不是 `checked`** —— `checked` 恒为 false，只读 checked 会得出错误的 FAIL。"
      - "⚠️⚠️ **`selected` 读法（会话463 修正）**：工具返回的 `sig`/`next`。**不回传** `selected`；`--full` 也不回传（实测 `selected` 出现 0 次）。判据必须**直接读本步 evidence 的 `dump.xml`**（原始 XML 里 `selected=` 有 80 处），解析 `weeks_chip_group` 子节点的 `selected` 属性。"
      - "⚠️⚠️ **『全选』快捷项首次点击会被吸收（会话463 实测）**：第 1 次点 (1128,589) 后回读 dump，20 个周 chip 与『全选』自身 `selected` **全为 false**；**同坐标再点一次**才全部变 true。坐标经 OCR 核对无误（OCR 读得『全选』center=[1129,590]），**不是点空**。⇒ **点完『全选』必须回读 dump 确认 `selected=true`，全 false 就再点一次**（与 s1『空白格点两次』同类现象）。"
      - "选一个既非全选、也非单周/双周的自定义集合时，**三个快捷项会全部取消选中**（正常行为）。"
      - "⚠️ **用例原文写『全部/单选/双选』，实际 UI 文案是『全选/单周/双周』** —— 按 text 定位时用实际文案。"
      - text: >-
          ★★ **周数弹框默认就是「全选 20 周」**（会话473 实测：`全选` selected=true、20/20 已选）。
