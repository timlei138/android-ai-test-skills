# ── 执行须知（渲染到 MD 顶部，回放前必读）────────────────
# 为什么写在这里而不是 SKILL.md：这些是**跟着这条用例走**的操作约束，
# 不是通用规约。放 SKILL 里会被当背景噪音跳过，放这里才会在回放前被读到。
playbook:
  - title: "坑挂在步骤上，不放在文件级"
    body: |
      本文件的坑一律写在**它真正会出现的那一步**的 `pitfalls:` 下。
      回放是**按步走**的 —— 跑到第 2 步时第 1 步的坑还在眼前，**信息被稀释**，
      真正相关的那条反而看不见。**走到哪一步，就只看那一步的 `pitfalls`。**

  - title: "工具层的坑（与 App 无关，知识卡里不一定有）"
    body: |
      这类坑不属于任何页面，是**工具或操作方式本身**的问题：
      · ❌ `act input` 清空输入框会触发工具层崩溃
        （`ADB_KEYBOARD_CLEAR_TEXT` → `ExtractedText.text on a null object reference`），
        且崩溃后会话状态不明（`execution_state=may_have_executed`）
        —— 按规约**禁止重放**，会话只能以 BLOCKED 收尾。
      · ❌ 用 `swipe` 拨滚轮/滑列表：**有惯性会过冲**，来回震荡无法收敛。
        重复手势一律用 `act tap --repeat N --gap MS`。
      · ❌ 用 PowerShell 的 `for`/`foreach` 包 `run.py`：**中断即锁死会话**。
      ⚠️ 实测教训：某次**连拨滚轮 37 次**才想起查卡，而知识卡那节标题叫
      「弹框滚轮-上课时长循环」—— 从"我在拨滚轮"这个**现象根本检索不到它**。
      ⇒ 检索知识卡时，用你脑子里的**现象词**（拨不准/过冲/没反应）换几个说法多 grep 几次。

# ── 前置条件 ──────────────────────────────────────────
# 不满足就 BLOCKED。**绝不自己去凑条件**。
# ── 前置条件 ──────────────────────────────────────────
# 分三类（2026-10-15 定）——**因为"能不能动手改"是三种不同的事**：
#   goto    🧭 导航：把 App 开到某界面。起点由 session start 的冷启动钉死在首页，故必写。
#   prepare 🔧 准备：要动手改设备状态。**已有则跳过**（skip_if），做法写死在 do 里。
#   assert  🔒 断言：只能检查、改不了。不满足即 BLOCKED。
# ⚠️ 为什么必须分：原先笼统一个列表，AI 分不清该"动手做"还是"直接停"——
#    同一份 YAML 里，「存在课表」动手建了，「周视图有空白格」却不敢动而卡住。
# ⚠️ 清理类（pm clear / pm revoke）**只在用例明确要求时**才用（如「首次使用」）。
#    会话开始只 force-stop（关进程、不碰数据）。
# ⚠️ 条目**只增不删**：老条目里常含用例前提（如「未授予相机权限」「记下节数基线」），
#    那是断言依据，删掉了就没法判卷。
preconditions:
  - desc: 从日历首页进到课程表页（会话已冷启动复位，起点必为首页）
    type: goto
    target: 课程表页（.timetable.display.TimetableActivity）
    path: 日历首页 → 点右上角「更多」`iv_more` → 菜单里点「课程表」。⚠️ 菜单**四项共用 rid `item_title`**（课程表/纵览/年视图/设置），必须按 text 区分。两次调用即可到位（会话465 ev#3617 ev#3618 实测）。
    skip_if:
      activity: .timetable.display.TimetableActivity
    on_fail: BLOCKED
    verified_by: 会话465 ev#3617 ev#3618 实测两次调用到位
  - desc: ★起点：当前停在**日历首页**（有 iv_more 工具栏的那一屏）
    check:
      activity: .AllInOneActivity
    how: 读 activity 是否为 .AllInOneActivity；不是则先回到首页。
    on_fail: BLOCKED
    note: s1 依赖起点是首页（要经 更多 → 课程表 进入）。
    verified_by: 会话451 清数据后起于首页
    type: assert
  - desc: 清理日历数据 + 相机/图库权限回到未授予态（用例前提1「未授予相机/图库权限」+ 前提2「（清理APP数据）」）
    type: clean
    do: pm clear com.zui.calendar
    skip_if:
      all_of:
        timetable_state: empty
        permission: CAMERA=granted_false
    on_fail: BLOCKED
    note: >
      ⚠️ **`pm clear` 一次解决两件事**：数据清空（前提2）+ 权限重置为未授予（前提1）——
      所以原来是两条 `prepare`，现在合成一条 `clean`。**不要用 `pm revoke` 单独撤权限**：
      数据还在的话前提2 仍不满足，反而多一步。
      ⚠️ 本用例**测的就是权限流程**，所以**绝对不要预授权**，要让权限弹窗自然出现。
      ⚠️ 本应用**未在清单声明 android.permission.CAMERA** —— 它的「拍照」是 Intent 调起系统相机，
      故 CAMERA 恒为 granted=false；READ_MEDIA_IMAGES 走 Android 14 部分照片访问。
      ⚠️ 清完后首次打开依次出现『访问文件相关信息』权限说明框（点「同意」）
      与课程表引导页（`timetable_guide_button`「我知道了」）—— **顺着走完即可，不需要特殊处理**。
    verified_by: 会话451 ev#3512 clear 返回 Success；会话467 实测 pm clear 后首启两屏（ev#3642 ev#3643）
  - desc: 清数据后首启流程已处理（否则会卡在权限说明框或引导页，非本用例步骤）
    check:
      activity: .AllInOneActivity
      no_dialog: 日历需要使用以下权限
    how: '清数据后首次启动会依次出现：①『日历需要使用以下权限』说明框 → 点 button1『同意』；②课程表引导页 TimetableGuideActivity 『课程表上新了！』→ 点 timetable_guide_button『我知道了』。

      '
    on_fail: 按 knowledge/_system.md 默认同意策略处理，并在 summary 中如实报告环境变化
    verified_by: 会话451 ev#3515 ev#3516
    type: assert
steps:
  - id: s1
    desc: 从日历首页进课程表页空态
    case_step: "（非用例步骤：到达步骤1/2 的操作起点）"
    do:
      - tap: {rid: iv_more}
      - tap: {text: "课程表"}
    know:
      where: 日历首页 .AllInOneActivity → 课程表页空态 .timetable.display.TimetableActivity
      why_this: |
        清数据后首页是月份视图。iv_more **无 text/desc**，只能按 rid 定位。
        菜单弹出后菜单项无 rid，只能按 text 定位，第一项即『课程表』。
      locate: rid=iv_more ；菜单项按 text="课程表"
    expect:
      activity: ".timetable.display.TimetableActivity"
      node_present: {rid: btnCreateManually, text: "手动创建课程表"}
    on_fail: BLOCKED
    pitfalls:
      - "iv_more 没有 text/desc —— 用文案找『更多』会找不到，必须用 rid。"
      - "⚠️ **本文件两条预期实测均 FAIL**：本机不存在用例所述的相机/相册权限弹窗。
         失败根因是**应用未声明 CAMERA 权限、并用系统 PhotoPicker 承接图库导入**，
         属产品实现与用例描述不符，回放时不要期待会弹权限框。"
    evidence: "会话451 ev#3517 ev#3518"

  - id: s2
    desc: 点「拍照导入课程表」，走完提示框（用例步骤1）
    case_step: "1. 日历点击页面右上角更多按钮，选择课程表，点击\"拍照导入课程表\"按钮"
    do:
      - tap: {rid: btnImportFromPhoto, text: "拍照导入课程表"}
      - tap: {rid: button1, text: "知道了"}
    know:
      where: 课程表页空态
      why_this: |
        ⚠️ **点导入按钮后先弹的是日历自己的提示框**，不是权限框：
        alertTitle=『请确保图片清晰、完整』，button1=『知道了』。
        **必须点掉它**，否则后面什么都不发生。
        该框**与权限是否已授予无关，无论权限状态都会弹**。
      locate: rid=btnImportFromPhoto ；提示框 rid=button1（文案「知道了」）
    expect:
      activity: ".CaptureActivity"
      package: "com.zui.camera"
    on_fail: BLOCKED
    pitfalls:
      - "⚠️ **本步实测不出现任何权限弹窗**，点掉提示框后**直接进入系统相机**
         （com.zui.camera/.CaptureActivity）。这不是漏了一步，而是本机真实行为：
         应用清单未声明 CAMERA 权限，走 Intent 调起系统相机。"
    evidence: "会话451 ev#3519 ev#3520"

  - id: s3
    desc: 从相机返回，点「从图库导入课程表」，走完提示框（用例步骤2）
    case_step: "2. 返回课程表设置页，点击\"从图库导入课程表\"按钮"
    do:
      - back: true                                   # 从相机回到日历
      - tap: {rid: btnImportFromGallery, text: "从图库导入课程表"}
      - tap: {rid: button1, text: "知道了"}
    know:
      where: 课程表页空态
      why_this: |
        与 s2 同构：先弹提示框『请确保图片清晰、完整』，点掉后**直接进系统 PhotoPicker**，
        仍不出现权限弹窗。PhotoPicker 顶部有 privacy_text=
        『此应用只能访问您选择的照片』（Android 14 部分照片访问）。
      locate: rid=btnImportFromGallery ；提示框 rid=button1（文案「知道了」）
    expect:
      activity: "com.android.providers.media.photopicker.PhotoPickerGetContentActivity"
      package: "com.android.providers.media.module"
    on_fail: BLOCKED
    pitfalls:
      - "⚠️ 同样**不出现权限弹窗**（无『部分照片/全部允许』选择），直接进 PhotoPicker。"
      - "各 rid（btnImportFromPhoto/Gallery）在空态下才铺屏；有课表时入口在周视图工具栏。"
      - "本用例**只验入口与权限表现，不做真实导入**。
         选图后会触发约 20s 云端解析，超出范围；验完点『上一步』退出即可。"
    evidence: "会话451 ev#3521 ev#3522 ev#3523"

  - id: s4
    desc: 验证照片选择界面可用，然后退出（不产生导入数据）
    case_step: "（用例步骤2 后段：\"选择后可选择照片选择界面即可\"）"
    do:
      - tap: {rid: icon_thumbnail}                   # 选第一张照片
      - tap: {rid: btnCancel, text: "上一步"}        # 退回，不导入
    know:
      where: 系统 PhotoPicker → 裁剪页 .timetable.crop.CropImageActivity
      why_this: |
        本用例只验「能进图片选择界面」，**不要真的导入**（选图后会触发
        约 20s 的云端解析，超出本用例范围）。
        选图后进入 CropImageActivity，含 btnCancel『上一步』/ btnDone『完成』
        / btnRotateLeft『左转』/ btnRotateRight『右转』。
      locate: rid=icon_thumbnail ；rid=btnCancel
      # ⚠️ 2026-10-15 会话468 实测修正：icon_thumbnail 自身 clickable=false，
      #    直接 tap 它不会进裁剪页。要 tap 它的**可点祖先** FrameLayout，
      #    bounds 与缩略图相同 [0,646][330,976]，中心 (165,811)。
      locate_correction: |
        缩略图不可点！`icon_thumbnail` 的 clickable=false，须点它外层的可点容器：
          icon_thumbnail [0,646][330,976] clickable=false
            ↑1 FrameLayout clickable=false（同 bounds）
            ↑2 CardView     clickable=false（同 bounds）
            ↑3 FrameLayout  **clickable=true**  ← 点这个（中心 165,811）
        因 bounds 相同，直接用缩略图的中心坐标点击即可。
    expect:
      activity: ".timetable.crop.CropImageActivity"
    on_fail: BLOCKED
    pitfalls:
      - "⚠️ 所有缩略图**共用 icon_thumbnail 一个 rid**，且照片按时间倒序，
         别盲点第一张。缩略图 desc 含拍摄时间戳，可据此精确选图。"
      - text: >-
          ⚠️ **`icon_thumbnail` 自身不可点（clickable=false）** —— 按 rid 找到它之后
          **不能直接 tap**，否则看起来「点了没反应」，极易误判为功能缺陷或界面卡死。
          要点它外层的可点 `FrameLayout`（bounds 与缩略图完全一致 `[0,646][330,976]`，
          中心 (165,811)，所以直接用缩略图中心坐标点即可）。
          ⇒ 通用教训：**rid 找到了 ≠ 能点**。tap 前若不确定，先读 dump 确认该节点
          或其最近祖先的 `clickable=true`；`next`/observe 给出的坐标通常已是可点容器。
        evidence: "会话468 ev#3661 实测：tap 可点祖先 → CropImageActivity 命中"
      - text: >-
          ⚠️ **`btnCancel` 在裁剪页上，不在 PhotoPicker 上** —— PhotoPicker 的返回键是
          **无 rid 的「取消」文本**（[99,404]）。别在 PhotoPicker 上找 btnCancel。
        evidence: "会话468 ev#3661 实测：CropImageActivity 才有 btnCancel[154,189]"
    evidence: "会话451 ev#3527 ev#3528；会话468 ev#3661 ev#3662"

# ── 断言（对应用例的预期）─────────────────────────────
assertions:
  - id: a1
    case_expect: "1. 弹出权限弹窗，选择允许后打开相机即可，选择拒绝后提示需要授予相机权限"
    desc: 点拍照导入应弹相机权限弹窗
    check:
      dialog_present: {permission_dialog: "CAMERA"}
      # 本机实测：该弹窗不存在
    status_last_run: FAIL
    evidence: "会话451 finding#336 / ev#3520"
    actual: >
      **未出现任何权限弹窗，直接打开了相机。**
      点 btnImportFromPhoto → 提示框『请确保图片清晰、完整』→ 点『知道了』
      → activity **直接变为 .CaptureActivity、package 变为 com.zui.camera**，
      进入相机预览（shutter_button / 闪光灯 / 切换前后摄），全程无系统权限弹窗。
      旁证：`dumpsys package com.zui.calendar` 的 requested permissions 列表中
      **不含 android.permission.CAMERA** —— 该应用未声明相机权限，
      点该按钮应为 Intent 调起系统相机（由相机应用自身持有权限），
      故『拒绝后提示需要授予相机权限』的分支**不存在**。

  - id: a2
    case_expect: "2. 弹出权限弹窗，可选择部分照片或全部允许，选择后可选择照片选择界面即可，选择拒绝后提示需要授予相册权限"
    desc: 点图库导入应弹相册权限弹窗
    check:
      dialog_present: {permission_dialog: "READ_MEDIA_IMAGES 部分/全部"}
      picker_usable: {activity: ".timetable.crop.CropImageActivity"}
    status_last_run: FAIL
    evidence: "会话451 finding#337 / ev#3523 ev#3527"
    actual: >
      **未出现权限弹窗，直接进入系统相册选择器；照片选择界面本身正常可用。**
      点 btnImportFromGallery → 提示框 → 点『知道了』→ activity=
      com.android.providers.media.photopicker.PhotoPickerGetContentActivity，
      package=com.android.providers.media.module。
      PhotoPicker 顶部 privacy_text=『**此应用只能访问您选择的照片**』，
      即走 Android 14 部分照片访问形态，而非用例所述先弹权限弹窗再选择。
      选择界面可用：点 icon_thumbnail → CropImageActivity（裁剪页）正常。
      因无权限弹窗，『拒绝后提示需要授予相册权限』的分支**未能触发**。

