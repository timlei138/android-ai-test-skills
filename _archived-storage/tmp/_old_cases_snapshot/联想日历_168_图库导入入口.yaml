          **不要继续选图**（选图会触发约 20s 的云端解析，超出本用例范围）。
        from: "com.zui.calendar.md#坑-图库导入解析"
        quote_hash: "b8c78dd6"
    evidence: "会话435 ev#3146"

  - id: s3
    desc: 关掉 App 内提示框
    case_step: "（不属于用例步骤，但为进入图片选择入口的必要前置）"
    do:
      - tap: {rid: button1, text: "知道了"}
    know:
      where: 课程表页上的模态提示框
      why_this: |
        **这一步不能省**：点击图库导入会先弹日历自己的提示框，
