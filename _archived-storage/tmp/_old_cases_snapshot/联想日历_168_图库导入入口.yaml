        该框**与系统权限弹窗无关，无论权限是否已授予都会弹**。
      locate: rid=button1（文案「知道了」）
    expect:
      activity_changed_to: "com.android.providers.media.photopicker.PhotoPickerGetContentActivity"
    on_fail: BLOCKED
    pitfalls:
      - text: "⚠️ 不点掉这个框，PhotoPicker 永远不出现 —— 不要归因为『权限没给』或『功能坏了』。"
        # ↓ 引用锚：该结论来自知识卡。改了知识卡这一节，kb_check 会报"引用已过期"
        from: "com.zui.calendar.md#链路-导入弹窗顺序"
        quote_hash: "790023a7"
      - text: "该框是日历自己的，不是系统权限框；**不需要也不应该**去 revoke/grant 权限。"
        from: "com.zui.calendar.md#链路-导入弹窗顺序"
        quote_hash: "790023a7"
      - "**不要用『功能没反应』断定缺陷** —— 先确认提示框是否已点掉。
