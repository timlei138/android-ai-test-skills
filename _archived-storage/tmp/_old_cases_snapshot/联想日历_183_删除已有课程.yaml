# ── 执行须知（渲染到 MD 顶部，回放前必读）────────────────
# 为什么写在这里而不是 SKILL.md：这些是**跟着这条用例走**的操作约束，
# 不是通用规约。放 SKILL 里会被当背景噪音跳过，放这里才会在回放前被读到。
playbook:
  - title: "坑挂在步骤上，不放在文件级"
    body: |
      本文件的坑一律写在**它真正会出现的那一步**的 `pitfalls:` 下。
      回放是**按步走**的 —— 跑到第 2 步时第 1 步的坑还在眼前，**信息被稀释**，
      真正相关的那条反而看不见。**走到哪一步，就只看那一步的 `pitfalls`。**

  - title: "工具层的坑（与 App 无关，知识卡里不一定有）"
    body: |
      这类坑不属于任何页面，是**工具或操作方式本身**的问题：
      · ❌ `act input` 清空输入框会触发工具层崩溃
        （`ADB_KEYBOARD_CLEAR_TEXT` → `ExtractedText.text on a null object reference`），
        且崩溃后会话状态不明（`execution_state=may_have_executed`）
        —— 按规约**禁止重放**，会话只能以 BLOCKED 收尾。
      · ❌ 用 `swipe` 拨滚轮/滑列表：**有惯性会过冲**，来回震荡无法收敛。
        重复手势一律用 `act tap --repeat N --gap MS`。
      · ❌ 用 PowerShell 的 `for`/`foreach` 包 `run.py`：**中断即锁死会话**。
      ⚠️ 实测教训：某次**连拨滚轮 37 次**才想起查卡，而知识卡那节标题叫
      「弹框滚轮-上课时长循环」—— 从"我在拨滚轮"这个**现象根本检索不到它**。
      ⇒ 检索知识卡时，用你脑子里的**现象词**（拨不准/过冲/没反应）换几个说法多 grep 几次。

# ── 前置条件 ──────────────────────────────────────────
# 不满足就 BLOCKED。**绝不自己去凑条件**。
# ── 前置条件 ──────────────────────────────────────────
# 分三类（2026-10-15 定）——**因为"能不能动手改"是三种不同的事**：
#   goto    🧭 导航：把 App 开到某界面。起点由 session start 的冷启动钉死在首页，故必写。
#   prepare 🔧 准备：要动手改设备状态。**已有则跳过**（skip_if），做法写死在 do 里。
#   assert  🔒 断言：只能检查、改不了。不满足即 BLOCKED。
# ⚠️ 为什么必须分：原先笼统一个列表，AI 分不清该"动手做"还是"直接停"——
#    同一份 YAML 里，「存在课表」动手建了，「周视图有空白格」却不敢动而卡住。
# ⚠️ 清理类（pm clear / pm revoke）**只在用例明确要求时**才用（如「首次使用」）。
#    会话开始只 force-stop（关进程、不碰数据）。
# ⚠️ 条目**只增不删**：老条目里常含用例前提（如「未授予相机权限」「记下节数基线」），
#    那是断言依据，删掉了就没法判卷。
preconditions:
  - desc: 从日历首页进到课程表页（会话已冷启动复位，起点必为首页）
    type: goto
    target: 课程表页（.timetable.display.TimetableActivity）
    path: 日历首页 → 点右上角「更多」`iv_more` → 菜单里点「课程表」。⚠️ 菜单**四项共用 rid `item_title`**（课程表/纵览/年视图/设置），必须按 text 区分。两次调用即可到位（会话465 ev#3617 ev#3618 实测）。
    skip_if:
      activity: .timetable.display.TimetableActivity
    on_fail: BLOCKED
    verified_by: 会话465 ev#3617 ev#3618 实测两次调用到位
  - desc: ★起点：当前停在**课程表页-周视图**（能看见课程卡片的那一屏）
    check:
      activity: .timetable.display.TimetableActivity
    how: 读 activity 并确认存在 curriculum_card_view 节点；不是则先导航到该页。
    on_fail: BLOCKED
    note: '⚠️ 从别处过来时注意：**从周视图按 back 是回日历首页，不是回上一级**， 别用 back 在课程表内部找路。

      '
    verified_by: 会话449 起于周视图
    type: assert
  - desc: 设备上存在一个**含课程**的已保存课程表，并已将其设为当前课程表
    check:
      current_timetable_has_courses: '>=1'
    how: '进周视图后，当前课程表应显示若干 curriculum_card_view（如「语文」）。 若当前课表是空的，先切到有课的课表再开始。

      '
    on_fail: BLOCKED
    note: '**切换当前课程表属于状态变更**。本次实测的切法是： 周视图 -> action_curriculum_table_settings（进「全部课程表」列表页） -> 右上 action_schedule『编辑』进多选态 -> 勾选目标课表 checkbox_select -> btn_set_default「设为当前课程表」-> 确认框 button1『确定』。 ⚠️ 列表页**点课表名是进编辑课程表页，不是切换**（见 paths 路径图）。 ⚠️ 切换后列表会重排，被设为当前的课表升到首项、带 tv_default_badge『当前』。

      '
    verified_by: 会话449 实测切为「学生课程表」（原当前为「空课表」）
    type: assert
  - desc: 删除前的课程数基线必须取（用于断言『课程被删除』）
    check:
      baseline_taken: true
    how: 在**周视图**上记录当前课表的课程卡片数与课程名清单
    on_fail: BLOCKED
    note: '⚠️ 基线**必须在周视图取**，不要在 CourseListActivity 里取（层级不同）。 知识卡要求：删除类断言按**课程数减少**判定，不要只凭"名字消失"。

      '
    verified_by: 会话449 实测基线：7 张卡片（语文/数学/英语/科学/社会/体育/音乐）
    type: assert
steps:
  - id: s1
    desc: 在周视图点单个课程，弹出课程列表，再点「编辑」进入编辑课程弹窗
    case_step: "2. 选择已经保存的课程表，点击单个课程"
    # ⚠️ 本步对应的是用例「步骤2」（已保存课程表路径）。
    #    用例「步骤1」（导入后确认识别结果页点课程）本次**未走**，见文件末 todo。
    do:
      - tap: {rid: curriculum_card_view, text: "语文"}
      - tap: {rid: ivEdit, desc: "编辑"}
    know:
      where: 课程表页-周视图 (.timetable.display.TimetableActivity) → 课程列表弹层 (.timetable.course.CourseListActivity)
      why_this: |
        **点课程卡片不是一步到编辑页，是两步**：
        第一步弹出 CourseListActivity（标题『课程列表』，条目形如
        clCourseDetail/tvFirstLine=课程名、tvSecondLine=「第1节 | 第1-20周」）；
        第二步点条目右侧的 ivEdit（desc=编辑）才进 EditCourseActivity。
        直接点卡片就以为进编辑页 = 误判。
      locate: >-
        课程卡片 rid=curriculum_card_view（同名多张，按 text= 课程名定位）；
        CourseListActivity 内 ivEdit 的 desc=编辑。
    expect:
      activity: ".timetable.course.EditCourseActivity"
      # ⚠️ 会话464 修正：原判据 `node_text: {rid: toolbar_title, equals: 编辑课程}` 是 **DEAD** ——
      #    实测会话449 的 18 个 dump 里，`toolbar_title` 的值只有
      #    『空课表』『全部课程表』『编辑课程表』，**从来没有『编辑课程』**，该判据恒为 false。
      #    「编辑课程」实为**无 rid 的普通 TextView**（b=[783,248][1047,380]）→ 按 text 判。
      text_present: "编辑课程"
      note: >
        回读确认：activity 进 EditCourseActivity，且屏上出现「编辑课程」字样（无 rid，按 text 匹配）。
        **这是区分本步与 182 s1 的关键** —— 两者 activity 完全相同，
        **只有标题文本不同**（点已有课程=编辑课程；点空白格=新建课程）。
    on_fail: BLOCKED
    pitfalls:
      - "⚠️ **点课程卡片走两步**：周视图 → CourseListActivity（课程列表）→ ivEdit → 编辑课程页。若点卡片后停在 CourseListActivity 不动，是**少了 ivEdit 这一步**，漏掉中间一步会停在『课程列表』，容易被误判成『点了没反应』，**不要重复点卡片硬试**。"
      - "同一课程在周视图可能有多张同名卡片（不同小节），按 text 定位到的不一定是同一张。"
    evidence: "会话449 ev#3474 ev#3476"

  - id: s2
    desc: 点底部「删除课程」，弹出删除确认框
    case_step: "3. 点击底部\"删除课程\""
    do:
      - tap: {rid: btnDelete, text: "删除课程"}
    know:
      where: 编辑课程页 (.timetable.course.EditCourseActivity)
      why_this: |
        编辑课程页字段均为既有值可编辑：etCourseName / etClassroom / etTeacher
        / llCourseTime→tvCourseTime / llCourseWeeks→tvCourseWeeks
        / llCourseColor+viewColorIndicator。
        **底部有 btnDelete『删除课程』**（本机 c=[1520,1536]），这是本用例的关键按钮。
      locate: rid=btnDelete
    expect:
      dialog_present: {text: "确定删除此课程吗？"}
    on_fail: BLOCKED
    pitfalls:
      - "编辑课程页**没有『取消』按钮，只有『关闭』** —— 别去找取消。"
      - "本机实测：**从周视图按 back 是回日历首页，不是上一级** —— 别用 back 在课程表内部找路。"
    evidence: "会话449 ev#3477"

  - id: s3a
    desc: 取消分支 —— 点「取消」，课程应保留
    case_step: "3. 点击\"取消\"按钮关闭弹框，返回课程表页面，课程未被删除"
    do:
      - tap: {rid: button2, text: "取消"}
    know:
      where: 删除确认框
      why_this: |
        确认框结构：message=『确定删除此课程吗？』，
        button2=取消，button1=删除。**取消是 button2，删除是 button1**
        （与常见"左取消右确定"一致，但 rid 必须先认准，别凭位置猜）。
      locate: rid=button2（文案「取消」）
    expect:
      activity: ".timetable.course.EditCourseActivity"
    on_fail: BLOCKED
    pitfalls:
      - "⚠️ **确认框 rid 别凭位置猜**：删除确认框是 **button2=取消、button1=删除**（与常见『左取消右确定』一致，但必须先认准 rid）。"
      - "取消后停在编辑课程页（不是回周视图）；此时 etCourseName 仍有值，
         即为『课程未被删除』的证据。"
    evidence: "会话449 ev#3478"

  - id: s3b
    desc: 删除分支 —— 重新进入并点「删除」，课程应被删除且自动返回周视图
    case_step: "3. 点击\"删除\"按钮删除该课程，返回课程表页面，该课程被删除"
    do:
      - tap: {rid: 关闭}          # 从编辑页退回，准备重新进入
      - tap: {rid: curriculum_card_view, text: "语文"}
      - tap: {rid: ivEdit, desc: "编辑"}
      - tap: {rid: btnDelete, text: "删除课程"}
      - tap: {rid: button1, text: "删除"}
    know:
      where: 编辑课程页 → 删除确认框 → 课程表页-周视图
      why_this: |
        取消分支结束后停在编辑课程页，需**先关闭再重新进入**才能再触发删除
        （本机实测：关闭按钮 c=[739,314]）。
        点确认框 button1『删除』后，应用**自动返回周视图**，无需再点返回。
      locate: rid=关闭（desc）；button1（文案「删除」）
    expect:
      activity: ".timetable.display.TimetableActivity"
    on_fail: BLOCKED
    pitfalls:
      - "⚠️ 断言必须按**课程数减少**（或课程名清单不含该课程）判定，
         **不要**只看 tvSecondLine/viewPager 里的残留文字 ——
         周视图是**异步渲染**，点完立刻 dump 可能仍读到旧文字，必要时间隔复验。"
      - "知识卡要求：改名验证要间隔后**复验一次**（本机实测间隔 2s 后结果一致）。"
      - "删除分支点完 button1 后**自动回周视图**，不需要再点返回键；本机实测：从周视图按 back 是回**日历首页**，不是上一级 —— 别用 back 找路。"
    evidence: "会话449 ev#3483 ev#3484"

# ── 断言（对应用例的预期）─────────────────────────────
assertions:
  - id: a1
    case_expect: "1. 点击单个课程后显示编辑课程弹框，点击对应字段可编辑信息，底部显示”删除课程“按钮"
    desc: 编辑课程弹窗打开、字段齐备、底部有删除课程
    check:
      activity: ".timetable.course.EditCourseActivity"
      # ⚠️ 会话464 修正：同 s1，`toolbar_title=编辑课程` 是 DEAD（该页无此取值）→ 改按 text 判。
      text_present: "编辑课程"
      nodes_present:
        - {rid: etCourseName}
        - {rid: etClassroom}
        - {rid: etTeacher}
        - {rid: llCourseTime}
        - {rid: llCourseWeeks}
        - {rid: llCourseColor}
        - {rid: btnDelete, text: "删除课程"}
    status_last_run: PASS
    evidence: "会话449 finding#330"
    # ⚠️ 本断言基于用例步骤2（已保存课程表）路径。用例步骤1（导入后确认页）未走。

  - id: a2
    case_expect: "2. 显示课程列表。点击后显示编辑课程弹窗"
    desc: 点课程卡片先出 CourseListActivity，点 ivEdit 后进编辑课程弹窗
    check:
      after_tap_card: {activity: ".timetable.course.CourseListActivity"}
      node_present: {rid: ivEdit, desc: "编辑"}
      after_tap_edit: {activity: ".timetable.course.EditCourseActivity"}
    status_last_run: PASS
    evidence: "会话449 finding#331"

  - id: a3
    case_expect: "3.点击后弹出确认删除按钮；点击”删除“按钮删除该课程，返回课程表页面，该课程被删除；点击”取消“按钮关闭弹框，返回课程表页面，课程未被删除；"
    desc: 确认框文案正确；取消分支保留课程；删除分支删除课程并返回周视图
    check:
      dialog_present: {text: "确定删除此课程吗？", button1: "删除", button2: "取消"}
      cancel_branch: {activity: ".timetable.course.EditCourseActivity", course_still_present: true}
      confirm_branch:
        activity: ".timetable.display.TimetableActivity"
        course_count_decreased: true
    status_last_run: PASS
    evidence: "会话449 finding#332"

# ── 坑 ────────────────────────────────────────────────
# ⚠️ **坑一律挂在具体步骤上**（每步的 `pitfalls:`），本文件**不再设文件级 pitfalls**。
#    原因（2026-10-15 定）：文件级是"全用例的坑混在一起"，
#    跑到第 2 步时第 1 步的坑还在眼前，**信息被稀释**；
#    而回放时是按步走的，坑必须跟着步走才用得上。

