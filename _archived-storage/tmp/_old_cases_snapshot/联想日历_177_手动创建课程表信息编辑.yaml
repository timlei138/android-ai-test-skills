# ── 执行须知（渲染到 MD 顶部，回放前必读）────────────────
# 为什么写在这里而不是 SKILL.md：这些是**跟着这条用例走**的操作约束，
# 不是通用规约。放 SKILL 里会被当背景噪音跳过，放这里才会在回放前被读到。
playbook:
  - title: "坑挂在步骤上，不放在文件级"
    body: |
      本文件的坑一律写在**它真正会出现的那一步**的 `pitfalls:` 下。
      回放是**按步走**的 —— 跑到第 2 步时第 1 步的坑还在眼前，**信息被稀释**，
      真正相关的那条反而看不见。**走到哪一步，就只看那一步的 `pitfalls`。**

  - title: "工具层的坑（与 App 无关，知识卡里不一定有）"
    body: |
      这类坑不属于任何页面，是**工具或操作方式本身**的问题：
      · ❌ `act input` 清空输入框会触发工具层崩溃
        （`ADB_KEYBOARD_CLEAR_TEXT` → `ExtractedText.text on a null object reference`），
        且崩溃后会话状态不明（`execution_state=may_have_executed`）
        —— 按规约**禁止重放**，会话只能以 BLOCKED 收尾。
      · ❌ 用 `swipe` 拨滚轮/滑列表：**有惯性会过冲**，来回震荡无法收敛。
        重复手势一律用 `act tap --repeat N --gap MS`。
      · ❌ 用 PowerShell 的 `for`/`foreach` 包 `run.py`：**中断即锁死会话**。
      ⚠️ 实测教训：某次**连拨滚轮 37 次**才想起查卡，而知识卡那节标题叫
      「弹框滚轮-上课时长循环」—— 从"我在拨滚轮"这个**现象根本检索不到它**。
      ⇒ 检索知识卡时，用你脑子里的**现象词**（拨不准/过冲/没反应）换几个说法多 grep 几次。

# ── 前置条件 ──────────────────────────────────────────
# 不满足就 BLOCKED。**绝不自己去凑条件**。
# ── 前置条件 ──────────────────────────────────────────
# 分三类（2026-10-15 定）——**因为"能不能动手改"是三种不同的事**：
#   goto    🧭 导航：把 App 开到某界面。起点由 session start 的冷启动钉死在首页，故必写。
#   prepare 🔧 准备：要动手改设备状态。**已有则跳过**（skip_if），做法写死在 do 里。
#   assert  🔒 断言：只能检查、改不了。不满足即 BLOCKED。
# ⚠️ 为什么必须分：原先笼统一个列表，AI 分不清该"动手做"还是"直接停"——
#    同一份 YAML 里，「存在课表」动手建了，「周视图有空白格」却不敢动而卡住。
# ⚠️ 清理类（pm clear / pm revoke）**只在用例明确要求时**才用（如「首次使用」）。
#    会话开始只 force-stop（关进程、不碰数据）。
# ⚠️ 条目**只增不删**：老条目里常含用例前提（如「未授予相机权限」「记下节数基线」），
#    那是断言依据，删掉了就没法判卷。
preconditions:
  - desc: 从日历首页进到课程表页（会话已冷启动复位，起点必为首页）
    type: goto
    target: 课程表页（.timetable.display.TimetableActivity）
    path: 日历首页 → 点右上角「更多」`iv_more` → 菜单里点「课程表」。⚠️ 菜单**四项共用 rid `item_title`**（课程表/纵览/年视图/设置），必须按 text 区分。两次调用即可到位（会话465 ev#3617 ev#3618 实测）。
    skip_if:
      activity: .timetable.display.TimetableActivity
    on_fail: BLOCKED
    verified_by: 会话465 ev#3617 ev#3618 实测两次调用到位
  - desc: ★起点：当前停在**课程表页**（空态或周视图均可）
    check:
      activity: .timetable.display.TimetableActivity
    how: 读 activity 确认在课程表模块内；不是则先导航到该页。
    on_fail: BLOCKED
    note: '⚠️ 本用例要的是空态（见下条）。若从周日历首页过来， 走 更多(iv_more) → 课程表 进入。

      '
    verified_by: 会话452 起于课程表页空态
    type: assert
  - desc: 课程表为空态（本用例从空态的「手动创建课程表」入口进入编辑页）
    type: clean
    do: pm clear com.zui.calendar
    skip_if:
      timetable_state: empty
    on_fail: BLOCKED
    note: >
      ⚠️ 本用例的前提是**从空态走「手动创建课程表」**，所以设备必须是空态。
      原来写成 `prepare` 但**没有 `do`** —— 判据在、不满足时却不知该做什么，
      会话466 就是这么卡住的（同款问题）。现按规约改成 `clean`：
      **要"干净"就用 `pm clear`**（稳定、一次到位），而不是逐个删课表
      （依赖界面操作、脆、慢、还可能删不干净）。
      ⚠️ 清完后首次打开会依次出现『访问文件相关信息』权限说明框（点「同意」）
      与课程表引导页（`timetable_guide_button`「我知道了」）—— 顺着走完即可，不需特殊处理。
      ⚠️ 若设备**已经是空态**（如紧接 168/169 之后跑），`skip_if` 会命中并**自动跳过**，不会重复清数据。
    verified_by: 会话452 实测进入时为空态三按钮；会话468 实测 pm clear 后首启两屏
  - desc: 从空态点「手动创建课程表」进入基本信息编辑页
    check:
      activity: .timetable.management.EditTimetableActivity
      title: 新建课程表
    how: 空态点 btnCreateManually
    on_fail: BLOCKED
    verified_by: 会话452 ev#3530
    type: assert
steps:
  - id: s1
    desc: 进入手动创建课程表的基本信息编辑页，逐项检查各字段与开关
    case_step: "1~6. 查看课程表名称 / 学期开始时间 / 当前周数 / 点击学期总周数 / 查看周末有课开关 / 点击显示非本周课程"
    do:
      - tap: {rid: btnCreateManually, text: "手动创建课程表"}
    know:
      where: 课程表页-空态 (.timetable.display.TimetableActivity) → 基本信息编辑页 (.timetable.management.EditTimetableActivity)
      why_this: |
        空状态下**没有工具栏**，三个按钮直接铺屏：拍照导入 / 从图库导入 / 手动创建。
        本条走的是第三项 btnCreateManually。
        进入后 title 为『新建课程表』（已保存课表再进来时 title 是『编辑课程表』，
        页面结构相同）。
      locate: rid=btnCreateManually
    expect:
      activity: ".timetable.management.EditTimetableActivity"
      node_text: {rid: toolbar_title, equals: "新建课程表"}
    on_fail: BLOCKED
    pitfalls:
      - "⚠️ 空状态**没有「更多」菜单** —— 别去工具栏找入口（知识卡专门记了这条）。"
      - "本页 title 会变：新建时是『新建课程表』，从已保存课表进来是『编辑课程表』，
        **页面结构相同**。断言 title 时注意区分。"
      - "『完成』按钮**不置灰但会静默拦截**（见 a7）：名称为空时 save_view / action_save
        实测 enabled=true clickable=true，点了 activity 不变且**无任何提示**。
        不要因为『按钮可点』就认为校验没生效，也不要因为『点了没反应』就判成崩溃
        —— 回读 activity 即可确认被拦住。"
    evidence: "会话452 ev#3530"

  - id: s2
    desc: 各字段的点开验证（学期开始时间 / 当前周数 / 学期总周数 / 两个开关）
    case_step: "2~6. 点击学期开始时间 / 当前周数 / 学期总周数 / 两个开关"
    do:
      - tap: {rid: layout_semester_start_date}     # 预期2：应出系统日期弹框
      - tap: {rid: left_button, text: "取消"}       # 关掉，不改值
      - tap: {rid: layout_current_week}            # 预期3：应出「当前周数」弹框
      - tap: {rid: button2, text: "取消"}
      - tap: {rid: layout_total_weeks}             # 预期4：应出「学期总周数」弹框
      - tap: {rid: button2, text: "取消"}
      - tap: {rid: layout_weekend_classes}         # 预期5：开→关 验一次即可
      - tap: {rid: layout_show_non_current_week}   # 预期6
    know:
      where: 基本信息编辑页 (.timetable.management.EditTimetableActivity)
      why_this: |
        **本页同时存在 layout_*（可点的整行）与 switch_*/tv_*（状态节点）两套 rid**，
        点的是 layout_*，读状态要回读 switch_* —— 用错会"点了没反应"。
        本页可见节点：
          et_schedule_name（占位『课程表名称（必填）』）
          layout_semester_start_date → tv_semester_start_date
          layout_current_week → tv_current_week / tv_current_week_desc
          layout_total_weeks → tv_total_weeks
          layout_weekend_classes → switch_weekend_classes
          layout_show_non_current_week → switch_show_non_current_week
          layout_time_settings
        两个取消按钮文案相同（都是「取消」），但**弹框不同、rid 也不同**：
        系统日期弹框是 left_button，应用自己的滚轮弹框是 button2。
      locate: rid=layout_semester_start_date / layout_current_week / layout_total_weeks / layout_weekend_classes / layout_show_non_current_week
    expect:
      activity: ".timetable.management.EditTimetableActivity"
    on_fail: BLOCKED
    pitfalls:
      - "⚠️ **学期开始时间弹的是系统 datePicker**（rid=datePicker，标题形如
         『2026年9月1日  周二』，左 left_button=取消 / 右 right_button=确定），
         **不是**应用自己的滚轮弹框 —— 别拿 button2 去找它。"
      - "⚠️ 开关的 checked 要回读 **switch_*** 节点；读 layout_* 是读不到状态的。"
    evidence: "会话452 ev#3534 ev#3536 ev#3538 ev#3539 ev#3540"

# ── 断言（对应用例的预期）─────────────────────────────
